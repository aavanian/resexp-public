# nginx configuration for client certificate authentication
# This configuration demonstrates how nginx can handle client certificate
# verification directly and pass certificate information to the backend

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format that includes client certificate information
    log_format client_cert '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'cert_subject="$ssl_client_s_dn" '
                          'cert_serial="$ssl_client_serial" '
                          'cert_verify="$ssl_client_verify"';

    access_log /var/log/nginx/access.log client_cert;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TLS configuration - modern, secure settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling (not used with self-signed certs, but good practice for production)
    ssl_stapling off;
    ssl_stapling_verify off;

    upstream backend {
        server backend:5000;
    }

    server {
        listen 443 ssl http2;
        server_name localhost family.example.com;

        # Server certificate (for HTTPS)
        ssl_certificate /etc/nginx/certs/server-cert.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;

        # Client certificate verification
        # This is the CA certificate that will be used to verify client certificates
        ssl_client_certificate /etc/nginx/certs/ca-cert.pem;

        # Request but don't require client certificate on all paths
        # This allows us to have some public pages and some protected pages
        # Set to 'on' to require certificate for all pages
        # Set to 'optional' to allow access without cert but verify if provided
        # Set to 'optional_no_ca' to accept any cert without verification
        ssl_verify_client optional;

        # Depth of certificate chain verification
        ssl_verify_depth 2;

        # Certificate Revocation List (CRL)
        # Uncomment and configure when using CRL
        # ssl_crl /etc/nginx/certs/crl.pem;

        # Root directory for static files (if any)
        root /usr/share/nginx/html;

        # Proxy settings for backend
        location / {
            # Pass request to backend
            proxy_pass http://backend;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass client certificate information to backend
            # These headers will be used by the Flask app to determine permissions

            # Distinguished Name (DN) - full subject
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

            # Common Name (CN) - usually the person's name
            proxy_set_header X-SSL-Client-CN $ssl_client_s_dn_cn;

            # Email address from certificate
            proxy_set_header X-SSL-Client-Email $ssl_client_s_dn_emailAddress;

            # Organizational Unit (OU) - used for permission level
            proxy_set_header X-SSL-Client-OU $ssl_client_s_dn_ou;

            # Certificate serial number
            proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

            # Verification status: SUCCESS, FAILED, or NONE
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;

            # Certificate validity dates
            proxy_set_header X-SSL-Client-Not-Before $ssl_client_v_start;
            proxy_set_header X-SSL-Client-Not-After $ssl_client_v_end;

            # Issuer DN
            proxy_set_header X-SSL-Client-Issuer-DN $ssl_client_i_dn;

            # Certificate fingerprint (SHA1)
            proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Example: Require certificate for specific paths
        # Uncomment to enforce certificate requirement on /admin and /family paths
        # location ~ ^/(admin|family) {
        #     # Require valid client certificate for these paths
        #     if ($ssl_client_verify != SUCCESS) {
        #         return 403 "Client certificate required and must be valid";
        #     }
        #
        #     proxy_pass http://backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        #     proxy_set_header X-SSL-Client-CN $ssl_client_s_dn_cn;
        #     proxy_set_header X-SSL-Client-Email $ssl_client_s_dn_emailAddress;
        #     proxy_set_header X-SSL-Client-OU $ssl_client_s_dn_ou;
        #     proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        #     proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        #     proxy_set_header X-SSL-Client-Not-Before $ssl_client_v_start;
        #     proxy_set_header X-SSL-Client-Not-After $ssl_client_v_end;
        # }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost family.example.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
