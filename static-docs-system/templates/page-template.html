<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --bg: #ffffff;
            --sidebar-bg: #f8f9fa;
            --border: #dee2e6;
            --text: #333;
            --link: #3498db;
            --link-hover: #2980b9;
            --code-bg: #f4f4f4;
            --highlight: #fff3cd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-header h1 {
            font-size: 1.5em;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .sidebar-header p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        /* Search */
        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .search-results {
            display: none;
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: bold;
        }

        .search-result-excerpt {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .highlight {
            background: var(--highlight);
            font-weight: bold;
        }

        /* Navigation */
        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 5px;
        }

        .nav-menu a {
            display: block;
            padding: 8px 12px;
            color: var(--text);
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: var(--secondary);
            color: white;
        }

        .nav-section {
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            max-width: 900px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: var(--primary);
            line-height: 1.3;
        }

        h1 { font-size: 2.5em; margin-top: 0; }
        h2 { font-size: 2em; border-bottom: 2px solid var(--border); padding-bottom: 0.3em; }
        h3 { font-size: 1.5em; }
        h4 { font-size: 1.25em; }

        p { margin-bottom: 1em; }

        a { color: var(--link); text-decoration: none; }
        a:hover { color: var(--link-hover); text-decoration: underline; }

        code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 0.9em;
        }

        pre {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        pre code {
            background: none;
            padding: 0;
        }

        ul, ol {
            margin-bottom: 1em;
            margin-left: 2em;
        }

        li { margin-bottom: 0.5em; }

        blockquote {
            border-left: 4px solid var(--secondary);
            margin: 1em 0;
            padding: 0.5em 1em;
            background: var(--sidebar-bg);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: var(--sidebar-bg);
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Documentation</h1>
                <p>Offline Static Docs</p>
            </div>

            <!-- Search Box -->
            <input type="text"
                   class="search-box"
                   id="searchInput"
                   placeholder="Search documentation..."
                   autocomplete="off">
            <div class="search-results" id="searchResults"></div>

            <!-- Navigation Menu -->
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" class="{{ACTIVE_INDEX}}">Welcome</a></li>
                    <li class="nav-section">Getting Started</li>
                    <li><a href="installation.html" class="{{ACTIVE_INSTALLATION}}">Installation</a></li>
                    <li><a href="quick-start.html" class="{{ACTIVE_QUICKSTART}}">Quick Start</a></li>
                    <li class="nav-section">Documentation</li>
                    <li><a href="user-guide.html" class="{{ACTIVE_USERGUIDE}}">User Guide</a></li>
                    <li><a href="api-reference.html" class="{{ACTIVE_API}}">API Reference</a></li>
                    <li class="nav-section">Examples</li>
                    <li><a href="examples.html" class="{{ACTIVE_EXAMPLES}}">Code Examples</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            {{CONTENT}}
        </main>
    </div>

    <script>
        // Search index - all pages
        const searchIndex = [
            {
                title: "Welcome",
                url: "index.html",
                content: "welcome documentation getting started introduction overview offline static",
                excerpt: "Welcome to the documentation. Get started with our comprehensive guides."
            },
            {
                title: "Installation",
                url: "installation.html",
                content: "installation setup install configure requirements browser",
                excerpt: "Learn how to install and set up the system."
            },
            {
                title: "Quick Start",
                url: "quick-start.html",
                content: "quick start tutorial guide first steps org-mode export",
                excerpt: "Get up and running quickly with this step-by-step tutorial."
            },
            {
                title: "User Guide",
                url: "user-guide.html",
                content: "user guide manual documentation usage instructions customize",
                excerpt: "Comprehensive guide covering all features and functionality."
            },
            {
                title: "API Reference",
                url: "api-reference.html",
                content: "api reference template build script functions",
                excerpt: "Technical reference for the documentation system."
            },
            {
                title: "Code Examples",
                url: "examples.html",
                content: "examples org-mode export emacs code samples templates",
                excerpt: "Practical examples showing common use cases."
            }
        ];

        // Simple search implementation
        function performSearch(query) {
            if (!query || query.length < 2) return [];

            const lowerQuery = query.toLowerCase();
            const words = lowerQuery.split(/\s+/);

            return searchIndex
                .map(item => {
                    let score = 0;
                    const titleLower = item.title.toLowerCase();
                    const contentLower = item.content.toLowerCase();

                    words.forEach(word => {
                        if (titleLower.includes(word)) score += 10;
                        if (contentLower.includes(word)) score += 5;
                    });

                    return { ...item, score };
                })
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 10);
        }

        function highlightText(text, query) {
            const words = query.toLowerCase().split(/\s+/);
            let result = text;

            words.forEach(word => {
                if (word.length < 2) return;
                const regex = new RegExp(`(${word})`, 'gi');
                result = result.replace(regex, '<span class="highlight">$1</span>');
            });

            return result;
        }

        function displayResults(results, query) {
            const container = document.getElementById('searchResults');

            if (results.length === 0) {
                container.innerHTML = '<div class="search-result-item">No results found</div>';
                container.classList.add('show');
                return;
            }

            const html = results.map(item => `
                <div class="search-result-item">
                    <a href="${item.url}">${highlightText(item.title, query)}</a>
                    <div class="search-result-excerpt">${highlightText(item.excerpt, query)}</div>
                </div>
            `).join('');

            container.innerHTML = html;
            container.classList.add('show');
        }

        // Initialize search
        const searchInput = document.getElementById('searchInput');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;

            if (query.length < 2) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            const results = performSearch(query);
            displayResults(results, query);
        });

        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                document.getElementById('searchResults').classList.remove('show');
            }, 200);
        });

        searchInput.addEventListener('focus', () => {
            if (searchInput.value.length >= 2) {
                const results = performSearch(searchInput.value);
                displayResults(results, searchInput.value);
            }
        });
    </script>
</body>
</html>
