<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background: #ffffff;
            --sidebar-bg: #f8f9fa;
            --border-color: #dee2e6;
            --text-color: #333;
            --link-color: #3498db;
            --link-hover: #2980b9;
            --code-bg: #f4f4f4;
            --search-highlight: #fff3cd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--background);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.5em;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        /* Search Box */
        .search-container {
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .search-results {
            display: none;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-top: 5px;
            max-height: 400px;
            overflow-y: auto;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .search-result-item:hover {
            background: var(--sidebar-bg);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-title {
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 5px;
        }

        .search-result-excerpt {
            font-size: 0.9em;
            color: #666;
        }

        .search-highlight {
            background: var(--search-highlight);
            font-weight: bold;
        }

        /* Navigation Menu */
        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 5px;
        }

        .nav-menu a {
            display: block;
            padding: 8px 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: var(--secondary-color);
            color: white;
        }

        .nav-menu .nav-section {
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
            max-width: 900px;
        }

        .content-frame {
            background: white;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: var(--primary-color);
            line-height: 1.3;
        }

        h1 { font-size: 2.5em; margin-top: 0; }
        h2 { font-size: 2em; border-bottom: 2px solid var(--border-color); padding-bottom: 0.3em; }
        h3 { font-size: 1.5em; }
        h4 { font-size: 1.25em; }

        p {
            margin-bottom: 1em;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 0.9em;
        }

        pre {
            background: var(--code-bg);
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        pre code {
            background: none;
            padding: 0;
        }

        ul, ol {
            margin-bottom: 1em;
            margin-left: 2em;
        }

        li {
            margin-bottom: 0.5em;
        }

        blockquote {
            border-left: 4px solid var(--secondary-color);
            margin: 1em 0;
            padding: 0.5em 1em;
            background: var(--sidebar-bg);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: var(--sidebar-bg);
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .container {
                flex-direction: column;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>

                    <li class="nav-section">Documentation</li>

                    <li class="nav-section">Examples</li>
                    <li><a href="#" data-page="examples">Code Examples</a></li>

        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-frame" id="contentFrame">

            </div>
        </main>
    </div>

  "Export current org file to HTML body only in docs directory."
  (interactive)

// ============================================================================
// SEARCH FUNCTIONALITY
// ============================================================================
/**
 * Simple client-side search implementation
 * No external dependencies - works entirely offline
 */

// Search index - will be populated from docs
let searchIndex = [];

/**
 * Initialize search index from documents
 */
function initializeSearchIndex() {
    // This will be populated with content from all documentation files
    // Format: { title, content, url, excerpt }
    searchIndex = [
        {
            title: "Welcome",
            url: "docs/welcome.html",
            content: "welcome documentation getting started introduction overview",
            excerpt: "Welcome to the documentation. Get started with our comprehensive guides."
        },
        {
            title: "Installation",
            url: "docs/installation.html",
            content: "installation setup install configure requirements dependencies",
            excerpt: "Learn how to install and set up the system on your machine."
        },
        {
            title: "Quick Start",
            url: "docs/quick-start.html",
            content: "quick start tutorial guide first steps hello world",
            excerpt: "Get up and running quickly with this step-by-step tutorial."
        },
        {
            title: "User Guide",
            url: "docs/user-guide.html",
            content: "user guide manual documentation how to usage instructions",
            excerpt: "Comprehensive guide covering all features and functionality."
        },
        {
            title: "API Reference",
            url: "docs/api-reference.html",
            content: "api reference methods functions classes interfaces types",
            excerpt: "Complete API documentation with all available methods and types."
        },
        {
            title: "Code Examples",
            url: "docs/examples.html",
            content: "examples code samples snippets demonstrations tutorials",
            excerpt: "Practical code examples showing common use cases and patterns."
        }
    ];
}

/**
 * Perform search across all indexed documents
 * @param {string} query - Search query
 * @returns {Array} - Array of matching results
 */
function performSearch(query) {
    if (!query || query.length < 2) {
        return [];
    }

    const normalizedQuery = query.toLowerCase().trim();
    const queryWords = normalizedQuery.split(/\s+/);

    // Score each document
    const results = searchIndex.map(doc => {
        let score = 0;
        const titleLower = doc.title.toLowerCase();
        const contentLower = doc.content.toLowerCase();

        // Check each query word
        queryWords.forEach(word => {
            // Title matches are worth more
            if (titleLower.includes(word)) {
                score += 10;
            }

            // Content matches
            if (contentLower.includes(word)) {
                score += 5;
            }

            // Exact phrase match bonus
            if (contentLower.includes(normalizedQuery)) {
                score += 15;
            }
        });

        return {
            ...doc,
            score: score
        };
    });

    // Filter and sort by score
    return results
        .filter(result => result.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10); // Limit to top 10 results
}

/**
 * Highlight search terms in text
 * @param {string} text - Text to highlight
 * @param {string} query - Search query
 * @returns {string} - HTML with highlighted terms
 */
function highlightSearchTerms(text, query) {
    if (!query) return text;

    const queryWords = query.toLowerCase().trim().split(/\s+/);
    let result = text;

    queryWords.forEach(word => {
        if (word.length < 2) return;
        const regex = new RegExp(`(${escapeRegex(word)})`, 'gi');
        result = result.replace(regex, '<span class="search-highlight">$1</span>');
    });

    return result;
}

/**
 * Escape special regex characters
 * @param {string} str - String to escape
 * @returns {string} - Escaped string
 */
function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

/**
 * Display search results
 * @param {Array} results - Search results to display
 * @param {string} query - Original search query
 */
function displaySearchResults(results, query) {
    const searchResults = document.getElementById('searchResults');

    if (results.length === 0) {
        searchResults.innerHTML = '<div class="search-result-item">No results found</div>';
        searchResults.classList.add('active');
        return;
    }

    const html = results.map(result => `
        <div class="search-result-item" onclick="loadPage('${result.url}')">
            <div class="search-result-title">${highlightSearchTerms(result.title, query)}</div>
            <div class="search-result-excerpt">${highlightSearchTerms(result.excerpt, query)}</div>
        </div>
    `).join('');

    searchResults.innerHTML = html;
    searchResults.classList.add('active');
}

/**
 * Hide search results
 */
function hideSearchResults() {
    const searchResults = document.getElementById('searchResults');
    setTimeout(() => {
        searchResults.classList.remove('active');
    }, 200);
}

/**
 * Load a page (referenced by search results)
 * @param {string} url - URL of page to load
 */
function loadPage(url) {
    // Extract page identifier from URL
    const pageId = url.replace('docs/', '').replace('.html', '');
    const navLink = document.querySelector(`[data-page="${pageId}"]`);
    if (navLink) {
        navLink.click();
    }
}

// Initialize search when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    initializeSearchIndex();

    const searchInput = document.getElementById('searchInput');

    // Perform search on input
    searchInput.addEventListener('input', function(e) {
        const query = e.target.value;

        if (query.length < 2) {
            hideSearchResults();
            return;
        }

        const results = performSearch(query);
        displaySearchResults(results, query);
    });

    // Hide results when clicking outside
    searchInput.addEventListener('blur', hideSearchResults);

    // Keep results visible when clicking on them
    document.getElementById('searchResults').addEventListener('mousedown', function(e) {
        e.preventDefault();
    });
});


// ============================================================================
// NAVIGATION FUNCTIONALITY
// ============================================================================

/**
 * Navigation for embedded content version
 * Content is loaded from EMBEDDED_PAGES object instead of files
 */

// Content cache
const contentCache = {};

/**
 * Load content for a specific page from embedded data
 */
function loadContent(page) {
    const contentFrame = document.getElementById('contentFrame');

    // Check cache first
    if (contentCache[page]) {
        contentFrame.innerHTML = contentCache[page];
        scrollToTop();
        return;
    }

    // Load from embedded pages
    if (EMBEDDED_PAGES[page]) {
        const html = EMBEDDED_PAGES[page];
        contentCache[page] = html;
        contentFrame.innerHTML = html;
        scrollToTop();
    } else {
        contentFrame.innerHTML = `
            <div style="padding: 20px;">
                <h2>Page Not Found</h2>
                <p>The page <code>${page}</code> could not be found.</p>
            </div>
        `;
    }
}

/**
 * Scroll main content to top
 */
function scrollToTop() {
    const mainContent = document.querySelector('.main-content');
    if (mainContent) {
        mainContent.scrollTop = 0;
    }
    window.scrollTo(0, 0);
}

/**
 * Update active navigation link
 */
function updateActiveNav(activeLink) {
    document.querySelectorAll('.nav-menu a').forEach(link => {
        link.classList.remove('active');
    });
    if (activeLink) {
        activeLink.classList.add('active');
    }
}

/**
 * Handle navigation click
 */
function handleNavClick(e) {
    e.preventDefault();

    const link = e.target.closest('a');
    if (!link) return;

    const page = link.getAttribute('data-page');
    if (!page) return;

    history.pushState({ page }, '', `#${page}`);
    loadContent(page);
    updateActiveNav(link);
}

/**
 * Load page from URL hash
 */
function loadFromHash() {
    const hash = window.location.hash.slice(1);
    const page = hash || 'welcome';

    const navLink = document.querySelector(`[data-page="${page}"]`);
    loadContent(page);
    updateActiveNav(navLink);
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    const navMenu = document.getElementById('navMenu');
    navMenu.addEventListener('click', handleNavClick);
    loadFromHash();

    window.addEventListener('popstate', function(e) {
        if (e.state && e.state.page) {
            const navLink = document.querySelector(`[data-page="${e.state.page}"]`);
            loadContent(e.state.page);
            updateActiveNav(navLink);
        }
    });
});

    </script>
</body>
</html>
